<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" role="img" aria-label="Effi Studio">
  <!--
    Effi Studio — macOS app icon SOURCE.

    THIS IS THE ONLY ICON. There is exactly one app icon for both experiences;
    Build and Verify are expressed as TEXT in the UI, never as separate icons.
    Do NOT add a Verify icon.

    LITERAL HEX IS CORRECT HERE, and only here. Everywhere else in this
    codebase colour comes from a CSS custom property, but an icon is exported
    to .icns/.png outside the stylesheet and cannot read one. These three
    values are therefore hard-coded on purpose:
      #080F24  field       (the 100px macOS margin showing around the tile)
      #121C3C  squircle    (the icon tile itself, raised navy)
      #76CFFF  mark        (cyan accent)

    LAYOUT (1024 canvas)
      Field      0..1024 full bleed.
      Squircle   824 x 824 centred -> the macOS content box, 100px margin on
                 every side (824/1024 = 80.5%, Big Sur app-icon proportion).
      Mark       532 x 532 centred on (512, 512) -> 51.95% of the canvas
                 ("roughly 52%"), spanning 246..778. The mark is the master
                 effi-mark.svg path data: its 24-unit grid is scaled by
                 532/24 = 22.1667 and translated by 246, so grid 0..24 lands
                 exactly on 246..778 and the proportions are untouched. The
                 glyph fills that grid in x and runs 1.5..22.5 in y, so its
                 ink sits at x 253.8..777.6, y 279.3..745.2 on the canvas.

    THE SQUIRCLE IS A GENUINE SUPERELLIPSE, NOT A ROUNDED RECT.
      Curve:    |x/412|^5 + |y/412|^5 = 1, centred on (512, 512).
      Emitted as 64 cubic Bezier segments fitted per octant against the
      analytic curve: max deviation 0.018px on a 1024 canvas, zero gap
      between segments.
      Why it is not a rounded rect: curvature varies CONTINUOUSLY all the way
      along the boundary (radius of curvature 13255px at 1deg -> 801px at
      10deg -> 179px at 30deg -> 126.8px at the 45deg corner, then back out
      symmetrically). A rounded rect has infinite radius along the flats and
      then a single step discontinuity to one constant radius. Fitting the
      best rounded rect (r = 126.8px) to this outline leaves a 229px maximum
      error on the top edge alone.

    No raster element, no embedded bitmap, no filters, no gradients, no masks.
    Paths only, so this file exports cleanly at any size.
  -->

  <!-- field -->
  <path d="M0 0H1024V1024H0Z" fill="#080F24" />

