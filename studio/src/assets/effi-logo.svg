<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" role="img" aria-label="Effi Studio">
  <!--
    Effi Studio horizontal lockup.

    DERIVED FROM effi-mark.svg — NOT REDRAWN.
    The mark below is the master path data verbatim: the ribbon capital E, five
    sheared quadrilaterals (three bars joined down the left by two fold
    connectors) that read as one ribbon turning back on itself. The five d
    strings are character identical to effi-mark.svg and are wrapped in ONE
    uniform transform. Nothing about their proportions changes:
      translate(10 10) scale(0.833333)
      -> the master 24x24 box lands on x10..30 / y10..30, so the glyph sits
         exactly where the previous mark sat and renders at lockup size with
         the same optical padding it has as a standalone 24 unit symbol.
         Drawn content spans x10.29..29.98, y11.25..28.77, centred on y20.

    The top and middle bars shear LEFT going down, the bottom bar shears
    RIGHT. That asymmetry is measured from the raster, not invented; it is
    what makes the ribbon read as folded rather than as three parallel slabs.
    Do not "correct" it, and do not reflow the folds to square the glyph.

    GEOMETRY
      Symbol box               20 units
      Clear space              10 units = half the symbol height, on ALL four
                               sides. Content is confined to x10..150, y10..30;
                               the mark occupies x10..30, y10..30.
      Effi wordmark            cap height 16, baseline y28, stem 2.5
                               (stem/cap = 0.156 -> semibold), x40..73.5
      Studio                   cap height 10, baseline y28, stem 1.5,
                               tracking 3.4 (0.34em), x82..137.3
      Vertical alignment       the mark centres on y20; the Effi cap block
                               (12..28) and the Studio cap block (18..28) share
                               BASELINE y28, which is the real alignment. They
                               do not share a centre -- 18..28 centres on y23.

    TEXT IS OUTLINED. This file contains no SVG text element, no embedded
    typeface rule and no font reference of any kind. Every letter is a
    filled path, so the lockup renders identically with no fonts installed on
    the viewer's machine. No raster, no filters, no masks. Paths only, plus
    the one gradient described below.

    ==============================  COLOUR  ===============================
    THE BRAND GRADIENT LIVES HERE AND ONLY HERE.

    The mark is filled with the violet to blue to cyan ramp defined in the
    defs block below. The bare symbol, effi-mark.svg, stays
    currentColor: across a 20px glyph a three stop gradient is invisible, and
    buying it there would cost currentColor, which is the one thing BrandMark
    depends on. At lockup size (96px wide and up) the ramp is legible, and the
    lockup is never asked to inherit currentColor the way the bare mark is, so
    this is the one place the gradient belongs.

    The WORDMARK stays fill="currentColor". Only the mark carries the
    gradient, so the lockup still adapts to whatever surface it sits on: set
    `color` on the parent.

    The brand violet and brand blue tokens appear here as gradient stops
    ONLY. They measure 4.49:1 and 3.82:1 on navy, below the AA floor for text,
    so they may carry gradients and large decoration and may NEVER carry text.

    The gradient id is `effi-ribbon`, not `a` or `g1`, on purpose: if this
    lockup is inlined twice in one document, a generic id collides and the
    second instance silently adopts the first instance's gradient.
    =======================================================================

    ============================  MINIMUM SIZE  ============================
    MINIMUM WIDTH FOR THIS LOCKUP: 96px. Use 96-120px and above.

    Below ~96px the Studio line stops being legible. At 96px wide the render
    scale is 96/160 = 0.6, so Studio's 1.5-unit stems land on 0.90px — already
    sub-pixel, and its cap height is only 6.0px. At 80px wide those become
    0.75px stems and a 5.0px cap: the stems grey out to a smear and the o/d
    counters close up. The ribbon's two fold counters close up with them.

    CONSUMERS MUST NOT SCALE THIS LOCKUP BELOW 96px WIDE.
    Below that floor, drop to the bare mark (effi-mark.svg) instead. Shrinking
    the lockup is never the answer; swapping to the symbol is.
    =======================================================================

    There is exactly ONE lockup. Build and Verify are expressed as TEXT
    elsewhere in the UI — never as a second logo. Do not add Build/Verify
    lockup variants.
  -->

  <defs>
    <linearGradient id="effi-ribbon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#4263EB"/>
      <stop offset="1" stop-color="#76CFFF"/>
    </linearGradient>
  </defs>

  <!-- ===== MARK: effi-mark.svg, uniformly scaled. DO NOT EDIT THE PATH DATA. ===== -->
  <g transform="translate(10 10) scale(0.833333)" fill="url(#effi-ribbon)">
    <path d="M8.16 1.5L23.84 1.5L20.07 6.76L4.22 6.76Z"/>
    <path d="M2.49 6.76L8.62 6.76L6.66 9.38L0.53 9.38Z"/>
    <path d="M6.46 9.38L19.07 9.38L14.92 14.63L2.3 14.63Z"/>
    <path d="M2.33 14.63L8.37 14.63L6.39 17.27L0.35 17.27Z"/>
    <path d="M0.37 17.27L20.19 17.27L23.98 22.52L5.38 22.52Z"/>
  </g>

  <!-- ===== WORDMARK "Effi" — outlined, cap height 16, baseline y28 ===== -->
  <path
    fill="currentColor"
    d="M40 12H50V14.5H42.5V18.75H49V21.25H42.5V25.5H50V28H40Z
       M53.9 28V19.5H52V17H53.9V16A4 4 0 0 1 57.9 12H60.2V14.5H57.9A1.5 1.5 0 0 0 56.4 16V17H58.7V19.5H56.4V28Z
       M62.4 28V19.5H60.5V17H62.4V16A4 4 0 0 1 66.4 12H68.7V14.5H66.4A1.5 1.5 0 0 0 64.9 16V17H67.2V19.5H64.9V28Z
       M71 17H73.5V28H71Z
       M71 12.5H73.5V15H71Z"
  />

  <!-- ===== "STUDIO" — outlined small caps, cap height 10, baseline y28 ===== -->
  <path
    fill="currentColor"
    fill-rule="evenodd"
    d="M88.789 19.892A3.5 2.875 0 1 0 85.5 23.75A2 1.375 0 1 1 83.621 25.595L82.211 26.108A3.5 2.875 0 1 0 85.5 22.25A2 1.375 0 1 1 87.379 20.405Z
       M92.4 18H99.4V19.5H96.65V28H95.15V19.5H92.4Z
       M102.8 18V24.4A3.6 3.6 0 0 0 110 24.4V18H108.5V24.4A2.1 2.1 0 0 1 104.3 24.4V18Z
       M113.4 18H115.6A5 5 0 0 1 115.6 28H113.4Z
       M114.9 19.5H115.6A3.5 3.5 0 0 1 115.6 26.5H114.9Z
       M124 18H125.5V28H124Z
       M128.9 23A4.2 5 0 1 0 137.3 23A4.2 5 0 1 0 128.9 23Z
       M130.4 23A2.7 3.5 0 1 0 135.8 23A2.7 3.5 0 1 0 130.4 23Z"
  />
</svg>
